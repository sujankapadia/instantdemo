[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instantdemo"
version = "0.1.0"
description = "Generate narrated demo videos of web applications from a JSON script"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sujan Kapadia" }]
keywords = ["demo", "video", "tts", "playwright", "screencast", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "claude-agent-sdk>=0.1.71",
    "playwright>=1.40",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "soundfile"]
pocket-tts = ["pocket-tts", "soundfile"]
piper = ["piper-tts", "pathvalidate"]
all-tts = ["kokoro>=0.9.4", "soundfile", "piper-tts", "pathvalidate", "pocket-tts"]
gui = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0"]
dev = ["pytest", "ruff", "httpx>=0.27"]

[project.scripts]
instantdemo = "instantdemo.cli:main"

[project.urls]
Homepage = "https://github.com/sujankapadia/instantdemo"
Repository = "https://github.com/sujankapadia/instantdemo"
Issues = "https://github.com/sujankapadia/instantdemo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/instantdemo"]

# The frontend bundle in src/instantdemo/server/web is gitignored
# (it's a build artifact). force-include ensures it's still added to the
# wheel when present, so pip-installed users get the GUI without npm.
[tool.hatch.build.targets.wheel.force-include]
"src/instantdemo/server/web" = "instantdemo/server/web"

[tool.hatch.build.targets.sdist]
include = ["src/instantdemo", "README.md", "LICENSE", "pyproject.toml"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.11"
