# Dependency CVE gate — both ecosystems.
#
# Why a schedule and not just push/PR: CVEs are published against
# dependencies we haven't touched in months; a push-only gate goes
# quiet exactly when the project does. The weekly cron is the half
# that actually catches things.
#
# Coverage note: the Python job audits core + gui + dev (what every
# install gets). The optional TTS extras (kokoro/pocket-tts/piper —
# the torch tree) are user-opt-in and too heavy to install weekly in
# CI; they're covered by Dependabot alerts (.github/dependabot.yml)
# instead.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit production dependencies (critical gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit all dependencies (report only)
        working-directory: frontend
        run: npm audit || true

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project (core + gui + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]" pip-audit
      - name: Audit installed environment
        # pip-audit has no severity filter: it fails on ANY known
        # vulnerability. Accepted risks get an explicit
        # --ignore-vuln <ID> here, with a comment saying why.
        run: pip-audit
